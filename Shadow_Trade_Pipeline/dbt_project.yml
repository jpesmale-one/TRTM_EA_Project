name: shadow_trade_pipeline
version: '1.0.0'
config-version: 2

profile: shadow_trade_pipeline

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  shadow_trade_pipeline:

    staging:
      +schema: silver          # writes to silver schema
      +materialized: view      # staging = views, no storage cost

    intermediate:
      +schema: silver          # intermediate also lives in silver
      +materialized: view

    marts:
      +schema: gold            # marts = gold schema
      +materialized: table     # gold = physical tables for Power BI