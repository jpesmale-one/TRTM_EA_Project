version: 2

sources:
  - name: bronze
    schema: bronze
    description: >
      Raw ShadowTradeMonitor logs ingested from MetaQuotes CSV files.
      Each row represents a single trade event (OPEN, MODIFY, or CLOSE).

    tables:
      - name: trade_monitor_logs
        description: >
          Bronze landing table. One row per trade event exactly as written
          by the ShadowTradeMonitor EA. No transformations applied.

        columns:
          - name: id
            description: Surrogate key, auto-generated by ingestion script.

          - name: server_time
            description: Broker server timestamp of the event.
            tests:
              - not_null

          - name: local_time
            description: Local machine timestamp at time of event.

          - name: broker_tz_offset
            description: Broker timezone offset in hours from UTC.

          - name: event_type
            description: >
              Trade events (OPEN, MODIFY, CLOSE) plus system events
              (LOG_ROLL, EA_START, EA_STOP, and any future EA events).
              System events are filtered out by the ingestion script before
              loading — only OPEN, MODIFY, CLOSE land in bronze.
            tests:
              - not_null

          - name: ticket
            description: MetaTrader trade ticket ID. Unique per trade position.
            tests:
              - not_null

          - name: symbol
            description: Trading pair e.g. EURUSD, GBPCHF, XAUUSD.

          - name: trade_type
            description: BUY or SELL.
            tests:
              - accepted_values:
                  values: ['BUY', 'SELL']

          - name: lots
            description: Position size in lots.

          - name: open_price
            description: Price at which the trade was opened.

          - name: stop_loss
            description: Stop loss price. 0.00000 on OPEN if set via subsequent MODIFY.

          - name: take_profit
            description: Take profit price. 0.00000 on OPEN if set via subsequent MODIFY.

          - name: profit_loss
            description: Realised P&L in account currency. Only meaningful on CLOSE rows.

          - name: notes
            description: >
              Raw notes string from EA. Contains strategy tag and close price.
              Formats seen:
                OPEN/MODIFY : "SHADOW" | "SHADOW #1" | "sXAUdow" | "sXAUdow #1"
                CLOSE       : "ClosePrice=1.05807 | SHADOW"
              The # number indicates scale-in position tier (0 = first entry).

          - name: ingested_at
            description: Timestamp when the row was loaded by the ingestion script.

          - name: source_file
            description: Name of the CSV file this row was loaded from.